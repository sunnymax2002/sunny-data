entities:
- id: domain-ba
  type: Domain
  label: Business Analysis
  metadata:
    tags:
      - domain-ba

- id: domain-ba-checklist
  type: Topic
  label: Business Analysis Checklist
  metadata:
    tags:
      - ba-checklist
  related_to:
    - target_id: domain-ba
      type: member_of     

# Business Metrics #

- id: ba-metric
  type: Metric
  label: Business Metrics
  metadata:
    tags:
      - ba-metric
  related_to:
    - target_id: domain-ba-checklist
      type: member_of

# Business Quality #
- id: ba-topic-bq
  type: Subtopic
  label: Business Quality
  metadata:
    tags:
      - ba-topic-bq
  related_to:
    - target_id: domain-ba-checklist
      type: member_of

- id: ba-bq-q:Q1
  type: Question
  label: Circle of Competence
  content: Does the business operate within your circle of competence, meaning you understand its industry, products, and competitive landscape?
  metadata:
    tags:
      - ba-bq-Q1
  related_to:
    - target_id: ba-topic-bq
      type: member_of

- id: ba-bq-q:Q2
  type: Question
  label: Business Model
  content: Does the business have a clear and sustainable business model that generates consistent revenue and profits? Is there a consistency track record for past 5 or more years?
  metadata:
    tags:
      - ba-bq-Q2
  related_to:
    - target_id: ba-topic-bq
      type: member_of

- id: ba-bq-q:Q3
  type: Question
  label: Niche Focus
  content: Does the business operate in a niche area? Such businesses often face less competition and can maintain higher margins. This may also provide insulation from government policies such as taxes and tarrifs (the niche product or service is very important for customer, and his behaviour won't change much due to taxes)
  metadata:
    tags:
      - ba-bq-Q3
  related_to:
    - target_id: ba-topic-bq
      type: member_of

- id: ba-bq-q:Q4
  type: Question
  label: Competitive Landscape
  content: Does the business have a clear understanding of its competitive landscape, including its main competitors and their strengths and weaknesses?
  metadata:
    tags:
      - ba-bq-Q4
  related_to:
    - target_id: ba-topic-bq
      type: member_of

- id: ba-bq-q:Q5
  type: Question
  label: Industry Trends
  content: Is the business operating in an industry with favorable long-term trends, such as growth in demand or technological advancements?
  metadata:
    tags:
      - ba-bq-Q5
  related_to:
    - target_id: ba-topic-bq
      type: member_of

- id: ba-bq-q:Q6
  type: Question
  label: Value Chain
  content: Is the business one of the strongest players in the overall value chain of product/service, e.g., semiconductor and foundries earn the highest gross margin in entire value chain of electonic products
  metadata:
    tags:
      - ba-bq-Q6
  related_to:
    - target_id: ba-topic-bq
      type: member_of

- id: ba-bq-q:Q7
  type: Question
  label: Reinvestment Opportunities
  content: Does the business have ample opportunities to reinvest its profits at high rates of return, indicating a strong growth potential? A great business needs incrementally lesser capital to grow the revenue, and is also able to grow the operating profits
  metadata:
    tags:
      - ba-bq-Q7
  related_to:
    - target_id: ba-topic-bq
      type: member_of

- id: ba-bq-q:Q8
  type: Question
  label: Customer Loyalty
  content: Does the business have a loyal customer base that provides recurring revenue and reduces customer acquisition costs? Does this provide the business a meaningful pricing power?
  metadata:
    tags:
      - ba-bq-Q8
  related_to:
    - target_id: ba-topic-bq
      type: member_of

- id: ba-bq-q:Q9
  type: Question
  label: Unknown Business
  content: Is the business relatively unknown to the general public, which may indicate a hidden gem with significant growth potential? This is often the case with small cap stocks, or companies that are not in the limelight of media and analysts
  metadata:
    tags:
      - ba-bq-Q9
  related_to:
    - target_id: ba-topic-bq
      type: member_of

# Risk Analysis #

- id: ba-topic-ra
  type: Subtopic
  label: Risk Analysis
  metadata:
    tags:
      - ba-topic-ra
  related_to:
    - target_id: domain-ba-checklist
      type: member_of

- id: ba-ra-q:R1
  type: Question
  label: Business Risks
  content: Does the business face significant risks that could impact its operations, such as economic downturns, technological disruptions, or regulatory changes?
  metadata:
    tags:
      - ba-ra-R1
  related_to:
    - target_id: ba-topic-ra
      type: member_of

- id: ba-ra-q:R2
  type: Question
  label: Management Risks
  content: Does the business have a history of management issues, such as poor decision-making, lack of transparency, or conflicts of interest?
  metadata:
    tags:
      - ba-ra-R2
  related_to:
    - target_id: ba-topic-ra
      type: member_of

- id: ba-ra-q:R3
  type: Question
  label: Financial Risks
  content: Does the business have a history of financial instability, such as high debt levels, inconsistent cash flow, or poor financial reporting?
  metadata:
    tags:
      - ba-ra-R3
  related_to:
    - target_id: ba-topic-ra
      type: member_of

- id: ba-ra-q:R4
  type: Question
  label: Market Risks
  content: Does the business operate in a volatile market, where prices can fluctuate significantly due to external factors such as commodity prices, currency exchange rates, or geopolitical events?
  metadata:
    tags:
      - ba-ra-R4
  related_to:
    - target_id: ba-topic-ra
      type: member_of

- id: ba-ra-q:R5
  type: Question
  label: Competitive Risks
  content: Does the business face significant competitive risks, such as new entrants to the market, changes in consumer preferences, or disruptive technologies?
  metadata:
    tags:
      - ba-ra-R5
  related_to:
    - target_id: ba-topic-ra
      type: member_of

# Economic Moats #

- id: ba-topic-em
  type: Subtopic
  label: Economic Moats
  metadata:
    tags:
      - ba
  related_to:
    - target_id: domain-ba-checklist
      type: member_of

- id: ba-em-q:M1
  type: Question
  label: Intangible Assets
  content: Does the business have strong intangible assets like brand, patents, or proprietary technology that provide a competitive advantage?
  metadata:
    tags:
      - ba-em-M1
  related_to:
    - target_id: ba-topic-em
      type: member_of

- id: ba-em-q:M2
  type: Question
  label: Network Effect
  content: Does the business benefit from a network effect, where the value of its product or service increases as more people use it?
  metadata:
    tags:
      - ba-em-M2
  related_to:
    - target_id: ba-topic-em
      type: member_of

- id: ba-em-q:M3
  type: Question
  label: Switching Costs
  content: Does the business create high switching costs for its customers, making it difficult for them to change to a competitor?
  metadata:
    tags:
      - ba-em-M3
  related_to:
    - target_id: ba-topic-em
      type: member_of

- id: ba-em-q:M4
  type: Question
  label: Cost Advantage
  content: Does the business have a cost advantage over its competitors, allowing it to offer lower prices or higher margins?
  metadata:
    tags:
      - ba-em-M4
  related_to:
    - target_id: ba-topic-em
      type: member_of

- id: ba-em-q:M5
  type: Question
  label: Economies of Scale
  content: Does the business benefit from economies of scale, where its cost per unit decreases as production increases?
  metadata:
    tags:
      - ba-em-M5
  related_to:
    - target_id: ba-topic-em
      type: member_of

- id: ba-em-q:M6
  type: Question
  label: Market Share
  content: Does the business have a significant market share in its industry, providing it with pricing power and competitive advantages? If this is not the case, could the moats it appears to possess be transient or son become irrelevant?
  metadata:
    tags:
      - ba-em-M6
  related_to:
    - target_id: ba-topic-em
      type: member_of

- id: ba-em-q:M7
  type: Question
  label: Real IP Moat
  content: Does R&D spend justify the moat & its sustainablity due to IP / patents, or its only an early mover advantage and competition can easily catch up?
  metadata:
    tags:
      - ba-em-M7
  related_to:
    - target_id: ba-topic-em
      type: member_of

# Financial Performance #

- id: ba-topic-fp
  type: Subtopic
  label: Financial Performance
  metadata:
    tags:
      - ba-topic-fp
  related_to:
    - target_id: domain-ba-checklist
      type: member_of

- id: ba-fp-q:F1
  type: Question
  label: Gross Profit Margin
  content: Does the business maintain a high gross profit margin, indicating strong pricing power and cost control?
  metadata:
    tags:
      - ba-fp-F1
  related_to:
    - target_id: ba-topic-fp
      type: member_of

- id: ba-fp-q:F2
  type: Question
  label: Operating Profit Margin
  content: Does the business have a healthy operating profit margin, reflecting efficient operations and cost management?
  metadata:
    tags:
      - ba-fp-F2
  related_to:
    - target_id: ba-topic-fp
      type: member_of

- id: ba-fp-q:F3
  type: Question
  label: Return on Capital Employed
  content: Does the business achieve a high return on capital employed, indicating effective use of its resources?
  metadata:
    tags:
      - ba-fp-F3
  related_to:
    - target_id: ba-topic-fp
      type: member_of

- id: ba-fp-q:F4
  type: Question
  label: Balance Sheet Strength
  content: Does the business have a strong balance sheet with low debt levels and sufficient liquidity to weather economic downturns? Check if cash more than borrowings, and what is the trend in interest cost (quick ratio)
  metadata:
    tags:
      - ba-fp-F4
  related_to:
    - target_id: ba-topic-fp
      type: member_of
      
- id: ba-fp-q:F5
  type: Question
  label: Revenue Growth
  content: Does the business demonstrate consistent revenue growth over time, indicating a strong demand for its products or services?
  metadata:
    tags:
      - ba-fp-F5
  related_to:
    - target_id: ba-topic-fp
      type: member_of

# Quality of Earnings #

- id: ba-topic-qe
  type: Subtopic
  label: Quality of Earnings
  metadata:
    tags:
      - ba-topic-qe
  related_to:
    - target_id: domain-ba-checklist
      type: member_of

- id: ba-qe-q:E1
  type: Question
  label: Shares Outstanding
  content: Are the number of shares outstanding reducing due to net buyback, despite issuance of ESOP/RSU, so that there's increased value for long term shareholders?
  metadata:
    tags:
      - ba-qe-E1
  related_to:
    - target_id: ba-topic-qe
      type: member_of

- id: ba-qe-q:E2
  type: Question
  label: Cash Flow Generation
  content: Does the business generate consistent and strong cash flow from its operations, providing a solid foundation for growth and shareholder returns?
  metadata:
    tags:
      - ba-qe-E2
  related_to:
    - target_id: ba-topic-qe
      type: member_of

- id: ba-qe-q:E3
  type: Question
  label: Trade Receiables and Inventory
  content: Does the business maintain a healthy balance between trade receivables and inventory, ensuring that it does not overextend credit or hold excessive stock? Are the receivables growing faster than revenue, which could indicate potential issues?
  metadata:
    tags:
      - ba-qe-E3
  related_to:
    - target_id: ba-topic-qe
      type: member_of

# TODO: Add ratios to questions

- id: ba-qe-q:E4
  type: Question
  label: Revenye Recognition
  content: Does the business use conservative revenue recognition practices, and avoids artifically inflating the earnings?
  metadata:
    tags:
      - ba-qe-E4
  related_to:
    - target_id: ba-topic-qe
      type: member_of

# TODO: Add other questions related to quality of earnings (Financial Shenanigans Book), such as those related to accounting practices, non-recurring items, and management's guidance on future earnings.

# Management Analysis #

- id: ba-topic-mg
  type: Subtopic
  label: Management Analysis
  metadata:
    tags:
      - ba-topic-mg
  related_to:
    - target_id: domain-ba-checklist
      type: member_of

- id: ba-mg-q:M1
  type: Question
  label: Skin in the Game
  content: Does the top management or owners of the business have significant shareholding (and insiders often buy when stock prices are low), so that they've vested interest in making good long term decisions for the business?
  metadata:
    tags:
      - ba-mg-M1
  related_to:
    - target_id: ba-topic-mg
      type: member_of

- id: ba-mg-q:M2  
  type: Question
  label: Capital Allocation Skills
  content: Has the management or owners of the business demonstrated good capital allocation skills, by acquiring strategically useful assets at the right price? Has the management avoided diworsification into unrelated areas? Study how the installed capacity has been utilized in the past, and whether management is making careful choices of capacity expansion, and not flowing along the wind (just because others are doing, due to a short term spike in demand)
  metadata:
    tags:
      - ba-mg-M2
  related_to:
    - target_id: ba-topic-mg
      type: member_of

- id: ba-mg-q:M3
  type: Question
  label: Transparency
  content: Does the management or owners of the business maintain a high level of transparency in their operations, financial reporting, and communication with shareholders?
  metadata:
    tags:
      - ba-mg-M3
  related_to:
    - target_id: ba-topic-mg
      type: member_of

- id: ba-mg-q:M4
  type: Question
  label: Track Record
  content: Does the management or owners of the business have a strong track record of under commitment (future guidance) and over delivering results, such as consistent revenue growth, profitability, and shareholder returns?
  metadata:
    tags:
      - ba-mg-M4
  related_to:
    - target_id: ba-topic-mg
      type: member_of